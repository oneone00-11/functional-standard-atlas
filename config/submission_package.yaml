# What actually goes to the journal, and where each part comes from.
#
# WHY THIS FILE EXISTS
# The manuscript has been gated for a while; the package around it has not. Three
# defects survived every check because nothing looked across deliverables:
#   the guardrail-test count is stated three times with three values
#     (manuscript, cover letter, Additional file 2 Note S12)
#   the minimum detectable rho is 0.107 in the manuscript and 0.197 in Note S6
#   Table S11 is cited in the text and absent from Additional file 1
# A fourth is structural: the delivered .xlsx and .pdf are assembled by hand, so
# nothing ties them to results/ and they drift silently.
#
# `generated_by` names the script that produces a deliverable from results/.
# `maintained_by_hand: true` is an explicit admission that one does not exist;
# tests/test_submission_package.py requires those to be re-confirmed whenever the
# manuscript changes, which is the only guarantee a hand-built file can carry.

root: ~/Desktop

packages:
  atlas:
    manuscript: functional-standard-atlas.docx
    files:
      - path: functional-standard-atlas.docx
        role: manuscript
        maintained_by_hand: true
      - path: GB_additional_files/Additional_file_1.xlsx
        role: supplementary tables
        generated_by: src/atlas/build_additional_file_1.py
        sources: results/
      - path: GB_additional_files/Additional_file_2.pdf
        role: supplementary information
        maintained_by_hand: true
        note: >-
          Pages 16-32 were repaired by hand after a font-overlap problem; the
          delivered PDF is not what the generator produces. Registered as
          hand-maintained rather than regenerated, so the repair is not lost.
      - path: GB_additional_files/GBcoverletter.pdf
        role: cover letter
        maintained_by_hand: true
        note: >-
          Deferred: it is rewritten per submission and the venue is undecided,
          so it is declared and currently absent, exactly as the companion's
          cover letter is. The gate reporting it missing is a true statement
          about whether the package is complete.
      - path: GB_additional_files/Supplemental_Related_Manuscript_1.pdf
        role: related manuscript
        maintained_by_hand: true
        exported_from: ~/Desktop/calibration_draft.docx
        note: >-
          Exported from the companion manuscript by hand. `exported_from` lets
          the freshness check compare the two; without it the delivered PDF sat
          three months behind, still carrying a claim the companion manuscript
          had retracted.
        must_contain:
          - neither changes the evidence strength
          - Kish effective sample size
          - Forty-eight automated tests
          - ascertainment rather than circularity
        must_not_contain:
          - more actionable calls without loss of accuracy
          - Ranking is saturated but calibration is not
        # The status line names a venue and a submission state, so it is not
        # spelled out in a tracked file. The six markers above already fail on a
        # stale export, and the wording of that line is an editorial decision
        # rather than something a gate should fix.
      - path: functional-standard-atlas_supplement_v5/Supplementary_Information.pdf
        role: supplementary information (parallel copy)
        maintained_by_hand: true
        note: >-
          A byte-identical copy of GB_additional_files/Additional_file_2.pdf, and
          nothing else. The two drifted once: this copy was a build behind, so it
          gave 0.050-0.062 where the submitted file and the generator both give
          0.049-0.062, and it lacked the ACMG-band caveat added in the Note. Two
          copies of one document is the hazard; keeping it is only justified while
          the submission directory and the supplement directory are assembled
          separately. Refresh it from Additional_file_2.pdf whenever that is
          rebuilt, or delete it and keep one.
      - path: functional-standard-atlas_supplement_v5/tables
        role: supplementary tables, one workbook each (parallel copy)
        generated_by: src/atlas/build_additional_file_1.py
        sources: results/
        is_directory: true

  bib:
    manuscript: calibration_draft.docx
    files:
      - path: calibration_draft.docx
        role: manuscript
        maintained_by_hand: true
      - path: BiB supplementary_material.docx
        role: supplementary tables and notes
        maintained_by_hand: true
        note: >-
          Assembled by hand. Its numeric content is pinned from the other side
          by tests/test_reported_numbers.py in the companion repository, which
          compares the manuscript against the pipeline, but nothing regenerates
          this file.
      - path: BiB_cover_letter.pdf
        role: cover letter
        maintained_by_hand: true
        note: >-
          Deferred: it is rewritten per submission and the venue is undecided,
          so it is declared and currently absent. The gate reporting it missing
          is a true statement about whether the package is complete.

# Quantities stated in more than one deliverable. A quantity is a labelled
# number, not a bare value: two files saying "0.9" about different things is
# fine, two files disagreeing about the guardrail-test count is not.
quantities:
  guardrail test count:
    pattern: '(\d{2,4})\s+guardrail tests'
  minimum detectable rho, deep intron:
    pattern: '(?:minimum (?:rho|ρ) detectable at 80% power is\s*|can only detect (?:rho|ρ)\s*≥\s*)(0\.\d{3})'
  atlas variants:
    pattern: '\b(64,178)\b'
  predictors scored:
    pattern: '\b(nineteen|19)\s+(?:variant effect )?predictors'
  tests covering the new analyses:
    pattern: '(\d{1,3})\s+of them covering'
