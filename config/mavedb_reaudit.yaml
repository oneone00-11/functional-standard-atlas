# Verdicts of the MaveDB survey's re-audit (atlas.mavedb_survey_reaudit), written by
# hand by the rules in that module's docstring. Per deposit: the family whose reading it
# shares (if any), each matched column's verdict (or, for a deposit of none, one
# verdict), what the verdict rests on (basis: text = a quotation describes the column;
# relation = a numeric relation between the columns pins it; header = the column's name
# and the numeric checks only), the evidence (source and a quotation of at most 25
# words) and a note. Sources: mavedb:score_set:<field>, mavedb:experiment:<field>,
# pmc:<PMCID> (full text cached by `literature`), table:header. `assemble` checks every
# quotation against its source, recomputes the relations and the numeric checks, and
# stops on a deposit without a verdict.
literature:
  PMC5740498: Weile et al. 2017, the TileSeq/BarSeq framework (UBE2I, CALM1); the deposits' publication
  PMC5547491: Rubin et al. 2017, Enrich2; the BRCA1 E3 deposit's publication, and the method behind the
    Enrich2 output columns
  PMC12147941: Olvera-León et al. 2024, RAD51C saturation genome editing; the deposits' publication
  PMC7359949: Zhang et al. 2020, CYP2C9 and CYP2C19 abundance; the deposit's publication
  PMC10577081: van Loggerenberg et al. 2023, HMBS; the deposit's publication
  PMC8322931: Weile et al. 2021, MTHFR; identified from the deposits' titles (MaveDB links none)
  PMC10866706: Weng et al. 2024, KRAS ddPCA; identified from the deposits' titles (MaveDB links none)
  PMC10412457: Tsuboyama et al. 2023, cDNA display proteolysis; the platform's publication, identified
    from the deposits' methods (MaveDB links none)
families:
  tsuboyama_combined:
    description: 'Protease-stability platform, combined scores: score is dG, with its 95% interval'
    columns:
      score_95CI_low: uncertainty_of_score
      score_95CI_high: uncertainty_of_score
    basis: text
    evidence:
    - source: mavedb:score_set:methodText
      quote: The score column is the dG value calculated using the coupled model, calculated from the
        counts across replicates and proteases.
    - source: pmc:PMC10412457
      quote: our Bayesian procedure produces confidence intervals for K 50 and Δ G estimates, producing
        a quality estimate for each individual measurement
    note: A model-based (Bayesian) interval on dG, not a spread between replicates; the score lies inside
      it in every row.
  tsuboyama_protease:
    description: 'Protease-stability platform, one protease: score is log10 K50, with its 95% interval;
      dG and its interval beside it'
    columns:
      score_95CI_low: uncertainty_of_score
      score_95CI_high: uncertainty_of_score
      dG_95CI_low: uncertainty_of_other
      dG_95CI_high: uncertainty_of_other
      fitting_err: undetermined
    basis: text
    evidence:
    - source: mavedb:score_set:methodText
      quote: The score column is the log10 K50 value calculated using the ratio of sequence counts.
    - source: pmc:PMC10412457
      quote: our Bayesian procedure produces confidence intervals for K 50 and Δ G estimates, producing
        a quality estimate for each individual measurement
    note: score lies inside score_95CI in every row; dG lies inside dG_95CI in every row and score inside
      it in few, so dG_95CI is dG's interval. fitting_err is described nowhere in the record or the paper.
  domainome:
    description: 'Domainome 1.0 (aPCA, DiMSum): score and sigma are raw_score and raw_sigma scaled linearly
      within each domain'
    columns:
      sigma: uncertainty_of_score
      raw_sigma: uncertainty_of_other
    basis: text
    evidence:
    - source: mavedb:score_set:methodText
      quote: Growth rates and growth rate errors were normalized within each protein domain by linearly
        scaling the data
    relations:
    - ratio:
      - sigma
      - raw_sigma
    - linear:
      - score
      - raw_score
    note: 'sigma / raw_sigma is one constant per deposit and equals the slope of score on raw_score: sigma
      is the error of score, raw_sigma that of raw_score.'
  tem1_err:
    description: TEM-1 lineage fitness scores with an estimated error column
    columns:
      err: uncertainty_of_score
    basis: text
    evidence:
    - source: mavedb:score_set:methodText
      quote: The estimated error ('err' column) is based on the percent difference in fitness between
        the nucleotide variant fitness and the average fitness
    note: An error of the score, but relative (a percent difference between codon-level and amino-acid-level
      fitness), not a standard error in the score's units.
  cohesin:
    description: 'Cohesin-dockerin binding: score with score_err; the raw log2 ratio with log2_ratio_err'
    columns:
      score_err: uncertainty_of_score
      log2_ratio_err: uncertainty_of_other
    basis: header
    evidence:
    - source: table:header
      quote: score,score_err,log2_ratio,log2_ratio_err
    - source: mavedb:score_set:methodText
      quote: The fitness score is listed as the score, and the raw $\log_2$ ratios are also included.
    note: No text defines the two error columns; the names pair them with score and log2_ratio, and both
      are non-negative. The paper is not in PMC.
  enrich2_replicates:
    description: 'Enrich2 output: the combined score and its SE, then each replicate''s score and SE'
    columns: {}
    basis: header
    evidence:
    - source: table:header
      quote: score,SE,epsilon,SE_Replicate_1,score_Replicate_1
    - source: pmc:PMC5547491
      quote: Variant standard errors are also calculated for each selection and replicate score
    note: The header is Enrich2's (score, SE, epsilon; per-replicate score and SE); the deposit's own
      record does not describe the columns, and the Enrich2 paper is the method's, not the deposit's.
  sge_bap1:
    description: 'BAP1 saturation genome editing, per exon: score is the continuous LFC'
    columns:
      SE_bind_continuous: uncertainty_of_score
      SE_bind_D4_D7: uncertainty_of_other
      SE_bind_D4_D10: uncertainty_of_other
      SE_bind_D4_D14: uncertainty_of_other
      SE_bind_D4_D21: uncertainty_of_other
    basis: relation
    evidence:
    - source: mavedb:score_set:methodText
      quote: to calculate the depletion kinetics of the variants within target regions
    relations:
    - equal:
      - score
      - processed_LFC_continuous
    - equal:
      - processed_Z_continuous
      - processed_LFC_continuous / SE_bind_continuous
      rtol: 0.005
    note: 'score equals processed_LFC_continuous, and processed_Z_continuous is that LFC over SE_bind_continuous:
      SE_bind_continuous is the score''s SE; the other SE_bind columns are the SEs of the other comparisons''
      LFCs. The deposit rounds to six decimals, so the ratio is checked to 0.5%.'
  sge_rad51c:
    description: 'RAD51C saturation genome editing: score is the D4-D14 z-score'
    columns:
      SE_bind_D4_D7: uncertainty_of_other
      SE_bind_D4_D14: uncertainty_of_other
      SE_bind_continuous: uncertainty_of_other
    basis: relation
    evidence:
    - source: pmc:PMC12147941
      quote: median-scaled LFCs were converted to z-scores by dividing by the standard error
    relations:
    - equal:
      - score
      - processed_adj_lfc_D4_D14 / SE_bind_D4_D14
    - equal:
      - z_score_continuous
      - processed_adj_lfc_continuous / SE_bind_continuous
    note: 'score is processed_adj_lfc_D4_D14 over SE_bind_D4_D14, a z-score: the SE_bind columns are the
      SEs of the LFCs, not of the score. No column is the score''s own uncertainty.'
  roth_tileseq:
    description: TileSeq/BarSeq maps (score, sd, se)
    columns:
      sd: uncertainty_of_score
      se: uncertainty_of_score
    basis: text
    evidence:
    - source: pmc:PMC5740498
      quote: the largest standard error associated with any experimentally measured score in the given
        dataset
  mthfr:
    description: MTHFR complementation maps (score with se; the experimental score with its own se beside
      it in some)
    columns:
      sd: uncertainty_of_score
      se: uncertainty_of_score
    basis: text
    evidence:
    - source: pmc:PMC8322931
      quote: A functionality score and associated measurement error was derived for each variant in each
        folinate concentration and genetic background.
    note: MaveDB links no publication; the paper is identified from the deposits' titles.
  mapk1:
    description: 'MAPK1/ERK2 drug selections: score is the mean of the replicate columns, the SD column
      their SD'
    columns:
      SCH_SD: uncertainty_of_score
      VRT_SD: uncertainty_of_score
    basis: relation
    evidence:
    - source: mavedb:experiment:methodText
      quote: Score is an average of 6 replicates normalized to the total reads per lane and log2 transformed
    note: 'Recomputed from the replicate columns (which the replicate pattern does not match): the score
      is their mean and the SD column their SD (ddof 0).'
  kcnq2:
    description: 'KCNQ2 patch clamp: score with SEM and the number of replicates'
    columns:
      SEM: uncertainty_of_score
    basis: header
    evidence:
    - source: table:header
      quote: score,SEM,replicates
    note: No text defines SEM; the header pairs it with the score and the replicate count. MaveDB links
      no publication.
  ldlr:
    description: LDLR uptake maps (score, sd, se, df)
    columns:
      sd: uncertainty_of_score
      se: uncertainty_of_score
    basis: header
    evidence:
    - source: table:header
      quote: score,hgvsp,aapos,sd,se,df
    note: The record does not describe the columns, nor does the paper's text.
