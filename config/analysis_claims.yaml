# Every sentence in the manuscript that asserts an analysis was performed,
# bound to the script that performs it and the output it produces.
#
# WHY THIS FILE EXISTS
# The number checker (atlas.check_manuscript_numbers) asks whether a value has a
# source. It cannot ask whether a *described analysis* exists, because such a
# sentence often carries no number at all -- and where it does, a low-precision
# figure matches unrelated pipeline values by coincidence. The complementarity
# sentence claimed a nineteen-predictor axis analysis; the matrix behind it has
# nine columns and has had nine since the commit that introduced the seven
# meta-predictors. No numeric check asks that question.
#
# tests/test_analysis_claims.py asserts that every script and output named here
# exists. Add a row when a claim is added to the manuscript; if a row cannot be
# filled, the claim has nothing behind it.
#
# status:  verified   -- script and output exist and support the claim
#          narrative  -- not an analysis claim (disclaimer, acknowledgement)
#          gap        -- the claim is not supported; see note

